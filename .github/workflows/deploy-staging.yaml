name: Update data and deploy Shiny app to Connect (staging)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["render-rmarkdown-staging"]
    types:
      - completed

permissions:
  contents: write

jobs:
  deploy-staging:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    env:
      R_VERSION: '4.5.3'
      CRAN_REPO: https://packagemanager.posit.co/cran/__linux__/jammy/latest

      # GitHub Actions secrets
      CONNECT_SERVER: ${{ secrets.CONNECT_SERVER }}   # set to "stage"
      CONNECT_ACCOUNT: ${{ secrets.CONNECT_ACCOUNT }}
      CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
      MY_PAT: ${{ secrets.MY_PAT }}

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            pkg-config

      - name: Install workflow packages
        run: |
          Rscript - <<'RS'
          options(repos = c(CRAN = Sys.getenv("CRAN_REPO")))
          pkgs <- c("rsconnect", "jsonlite", "remotes")
          install.packages(pkgs, dependencies = TRUE)

          if (!requireNamespace("rExpertQuery", quietly = TRUE)) {
            remotes::install_github(
              "USEPA/rExpertQuery",
              auth_token = Sys.getenv("MY_PAT"),
              dependencies = TRUE
            )
          }

          if (!requireNamespace("rsconnect", quietly = TRUE)) {
            stop("rsconnect failed to install")
          }
          RS

      - name: Verify app files
        run: |
          Rscript - <<'RS'
          appdir <- "app"
          required <- c(
            file.path(appdir, ".Rprofile"),
            file.path(appdir, "renv.lock"),
            file.path(appdir, "renv", "activate.R")
          )
          missing <- required[!file.exists(required)]
          if (length(missing)) {
            stop("Missing required renv files:\n", paste(missing, collapse = "\n"))
          }
          if (dir.exists(file.path(appdir, "packrat")) ||
              file.exists(file.path(appdir, "packrat.lock")) ||
              file.exists(file.path(appdir, "packrat.opts"))) {
            stop("Packrat files detected in app/")
          }
          cat("app/ looks renv-only and clean.\n")
          RS

      - name: Register Connect server
        run: |
          Rscript - <<'RS'
          rsconnect::addServer(
            name = "stage",
            url = "https://rstudio-connect.dmap-stage.aws.epa.gov"
          )
          RS

      - name: Authenticate to Posit Connect
        run: |
          Rscript - <<'RS'
          server <- Sys.getenv("CONNECT_SERVER")
          account <- Sys.getenv("CONNECT_ACCOUNT")
          api_key <- Sys.getenv("CONNECT_API_KEY")

          if (!nzchar(server)) stop("CONNECT_SERVER is not set")
          if (!nzchar(account)) stop("CONNECT_ACCOUNT is not set")
          if (!nzchar(api_key)) stop("CONNECT_API_KEY is not set")

          rsconnect::connectApiUser(
            account = account,
            server = server,
            apiKey = api_key,
            quiet = TRUE
          )
          RS

      - name: Deploy app to Connect
        run: |
          Rscript - <<'RS'
          repo <- Sys.getenv("CRAN_REPO")
          options(repos = c(CRAN = repo))

          server <- Sys.getenv("CONNECT_SERVER")
          account <- Sys.getenv("CONNECT_ACCOUNT")

          if (!nzchar(server)) stop("CONNECT_SERVER is not set")
          if (!nzchar(account)) stop("CONNECT_ACCOUNT is not set")

          rsconnect::deployApp(
            appDir = "app",
            server = server,
            account = account,
            forceUpdate = TRUE,
            launch.browser = FALSE
          )
          RS
